<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Group</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forms.css') }}">

</head>

<body>

    <main class="form-page">

        <div class="form-card">

            <a href="{{ url_for('dashboard') }}"
               class="back-button">

                <svg
                    class="back-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M19 12H5"></path>
                    <path d="M12 19L5 12L12 5"></path>
                </svg>

                Back to Dashboard

            </a>

            <h1>Create Group</h1>

            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Group Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        maxlength="1000"
                        rows="5"
                    ></textarea>

                </div>

                <button type="submit">
                    Create Group
                </button>

            </form>

        </div>

    </main>

</body>

</html>
