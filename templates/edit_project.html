<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Project</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

    <nav class="navbar">
        <h1>Project Manager</h1>

        <div class="navbar-right">

            <span class="navbar-username">
                Welcome, {{ username }}
            </span>
    
        
            <a
                href="{{ url_for('logout') }}"
                class="logout-link"
            >
                Logout
            </a>
        
        </div>
    </nav>

    
    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            <div class="flash-container">

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}
    
    <main class="dashboard">
        <a
            href="{{ url_for('project', project_id=project['id']) }}"
            class="back-button"
        >
            <svg
                class="back-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M19 12H5"></path>
                <path d="M12 19L5 12L12 5"></path>
            </svg>
        
            Back to Project
        </a>
        
        <h2>Edit Project</h2>

        <form method="POST">

            <div>
                <label for="name">
                    Project Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ project['name'] }}"
                    required
                >
            </div>


            <div>
                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ project['description'] }}</textarea>
            </div>


            <button type="submit">
                Save Changes
            </button>

        </form>

    </main>

</body>

</html>
