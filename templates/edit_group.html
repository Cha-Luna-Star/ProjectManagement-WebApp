<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Group</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

</head>

<body>

    <main>

        <h1>Edit Group</h1>

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div>

                <label for="name">
                    Group Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ group['name'] }}"
                    required
                >

            </div>

            <div>

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                >{{ group['description'] or '' }}</textarea>

            </div>

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a href="{{ url_for(
            'group',
            group_id=group['id']
        ) }}">
            Cancel
        </a>

    </main>

</body>

</html>
