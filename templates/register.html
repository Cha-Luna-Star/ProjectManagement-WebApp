<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                PM
            </div>
            
            <h2>Create Account</h2>
            
            <p class="auth-subtitle">
                Get started with Project Manager.
            </p>
            
            <form method="POST">
            
                <div>
            
                    <label for="username">
                        Username
                    </label>
            
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
            
                </div>
            
                <div>
            
                    <label for="password">
                        Password
                    </label>
            
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
            
                </div>
            
                <button type="submit">
                    Create Account
                </button>
            
            </form>
            
            <p class="auth-link">
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login
                </a>
            </p>

        </div>

    </main>

</body>

</html>
