<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                PM
            </div>
            
            <h2>Welcome Back</h2>
            
            <p class="auth-subtitle">
                Login to your Project Manager account.
            </p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash-message {{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form method="POST">
            
                <div>
            
                    <label for="username">
                        Username
                    </label>
            
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
            
                </div>
            
                <div>
            
                    <label for="password">
                        Password
                    </label>
            
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
            
                </div>
            
                <button type="submit">
                    Login
                </button>
            
            </form>
            
            <p class="auth-link">
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create an account
                </a>
            </p>

        </div>

    </main>

</body>

</html>
