<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Task</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

    <nav class="navbar">

        <h1>Project Manager</h1>

        <div class="navbar-right">

            <span class="navbar-username">
                Welcome, {{ username }}
            </span>
        
            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>
        
            <a
                href="{{ url_for('logout') }}"
                class="logout-link"
            >
                Logout
            </a>
        
        </div>
        
        <a href="{{ url_for('project', project_id=project['id']) }}">
            Back to Project
        </a>

    </nav>


    <main class="dashboard">

        <h2>Create Task</h2>

        <p>
            Project: {{ project["name"] }}
        </p>


        <form method="POST">

            <div>

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                >

            </div>


            <div>

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                ></textarea>

            </div>
            
            <div>

                <label for="due_date">
                    Due Date
                </label>
            
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                >
            
            </div>

            <div>

                <label for="priority">
                    Priority
                </label>
            
                <select
                    id="priority"
                    name="priority"
                >
            
                    <option value="Low">
                        Low
                    </option>
            
                    <option value="Medium" selected>
                        Medium
                    </option>
            
                    <option value="High">
                        High
                    </option>
            
                </select>
            
            </div>

            <button type="submit">
                Create Task
            </button>

        </form>

    </main>

</body>

</html>
