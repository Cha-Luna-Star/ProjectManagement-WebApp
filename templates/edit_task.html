<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

    <nav class="navbar">

        <h1>Project Manager</h1>

        <div class="navbar-right">

            <span class="navbar-username">
                Welcome, {{ username }}
            </span>
        
            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>
        
            <a
                href="{{ url_for('logout') }}"
                class="logout-link"
            >
                Logout
            </a>
        
        </div>
        
    </nav>

    
    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            <div class="flash-container">

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}

    <main class="dashboard">

        <a
            href="{{ url_for('project', project_id=project['id']) }}"
            class="back-button"
        >
            <svg
                class="back-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M19 12H5"></path>
                <path d="M12 19L5 12L12 5"></path>
            </svg>
        
            Back to Project
        </a>

        <h2>Edit Task</h2>


        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ request.form.get('title', task['title']) }}"
                    required
                >

            </div>

            <div>

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    {{ request.form.get('description', task['description'] or '') }}</textarea>
        
            </div>
            
            <div>

                <label for="due_date">
                    Due Date
                </label>
            
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ request.form.get('due_date', task['due_date'] or '') }}"               >
            
            </div>

            <div>

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="Pending"
                        {% if request.form.get('status', task['status']) == 'Pending' %}selected{% endif %}
                        Pending
                    </option>

                    <option value="In Progress"
                        {% if request.form.get('status', task['status']) == "In-Progress" %}selected{% endif %}
                        In Progress
                    </option>

                    <option value="Completed"
                        {% if request.form.get('status', task['status']) == 'Completed' %}selected{% endif %}
                        Completed
                    </option>

                </select>

            </div>

            <div>
                <label for="priority">
                    Priority
                </label>
            
                <select
                    name="priority"
                    id="priority"
                >
                    <option value="Low"
                        {% if request.form.get('priority', task['priority']) == 'Low' %}selected{% endif %}                        Low
                    </option>
            
                    <option value="Medium"
                        {% if request.form.get('priority', task['priority']) == '<Medium>' %}selected{% endif %}                        Low
                        Medium
                    </option>
            
                    <option value="High"
                        {% if request.form.get('priority', task['priority']) == 'High' %}selected{% endif %}                        Low
                        High
                    </option>
                </select>
            </div>
            
            {% if group_members %}
            
                <div>
                    <label for="assigned_to">
                        Assign To
                    </label>
            
                    <select
                        id="assigned_to"
                        name="assigned_to"
                    >
                        <option value="">
                            Unassigned
                        </option>
            
                        {% for member in group_members %}
            
                            <option
                                value="{{ member['id'] }}"
                                {% if request.form.get('assigned_to', task['assigned_to']|string) == member['id']|string %}
                                    selected
                                {% endif %}
                            >
                                {{ member['username'] }}
                            </option>
            
                        {% endfor %}
            
                    </select>
                </div>
            
            {% endif %}
            <button type="submit">
                Save Changes
            </button>

        </form>

    </main>

</body>

</html>
