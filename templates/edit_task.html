<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/base.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

    <nav class="navbar">

        <h1>Project Manager</h1>

        <div class="navbar-right">

            <span class="navbar-username">
                Welcome, {{ username }}
            </span>
        
            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>
        
            <a
                href="{{ url_for('logout') }}"
                class="logout-link"
            >
                Logout
            </a>
        
        </div>
        
        <a href="{{ url_for('project', project_id=project_id) }}">
            Back to Project
        </a>

    </nav>

    <main class="dashboard">

        <h2>Edit Task</h2>

        <form method="POST">

            <div>

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ task['title'] }}"
                    required
                >

            </div>

            <div>

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ task['description'] }}</textarea>

            </div>
            
            <div>

                <label for="due_date">
                    Due Date
                </label>
            
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ task['due_date'] or '' }}"
                >
            
            </div>

            <div>

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="Pending"
                        {% if task['status'] == 'Pending' %}selected{% endif %}>
                        Pending
                    </option>

                    <option value="In Progress"
                        {% if task['status'] == 'In Progress' %}selected{% endif %}>
                        In Progress
                    </option>

                    <option value="Completed"
                        {% if task['status'] == 'Completed' %}selected{% endif %}>
                        Completed
                    </option>

                </select>

            </div>

            <div>

                <label for="priority">
                    Priority
                </label>
            
                <select
                    id="priority"
                    name="priority"
                >
            
                    <option value="Low"
                        {% if task["priority"] == "Low" %}selected{% endif %}>
                        Low
                    </option>
            
                    <option value="Medium"
                        {% if task["priority"] == "Medium" %}selected{% endif %}>
                        Medium
                    </option>
            
                    <option value="High"
                        {% if task["priority"] == "High" %}selected{% endif %}>
                        High
                    </option>
            
                </select>
            
            </div>

            <button type="submit">
                Save Changes
            </button>

        </form>

    </main>

</body>

</html>
